<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dashboard</title>
        <link href="dashboard.css" type="text/css" rel="stylesheet"></link>
    </head>

    

    <body>
        <header class="header">
            <h1 id="title">Dashboard</h1>
        </header>

        <!-- The outline of the table -->
        <table class="container">
            <tbody>

            
                <!-- Table first row -->
                <tr class="row">

                    <!-- First Button (Google) -->
                    <td class="button">
                        <!-- Link to google's homepage on a separate page -->
                        <a href="https://www.google.com/webhp?tab=ww" target="_blank">
                            <!-- The button leading to the link above -->
                            <button type="button">
                                <!-- Content inside of the button -->
                                <img src="images/Google_logo.png" alt="Google logo" class="img" id="google">
                            </button>
                        </a>
                    </td>
                    
                    <!-- Second Button (YouTube) -->
                    <td class="button">
                        <!-- link to YouTube -->
                        <a href="https://www.youtube.com/" target="_blank">
                            <button type="button">
                                <img src="images/YouTube_logo.png" alt="YouTube_logo" class="img" id="youtube">
                            </button>
                        </a>
                    </td>

                    <!-- Third Button (D2L) -->
                    <td class="button">
                        <!-- link to D2L -->
                        <a href="https://d2l.lonestar.edu/d2l/home" target="_blank">
                            <button type="button">
                                <img src="images/D2L_logo.png" alt="D2L_logo" class="img" id="d2l">
                            </button>
                        </a>
                    </td>

                    
                </tr>


                <!-- Row 2 -->
                <tr class="row">
                    <!-- First Button (w3school) -->
                    <td class="button">
                        <!-- link to w3schools helping site -->
                        <a href="https://www.w3schools.com/" target="_blank">
                            <button type="button">
                                <img src="images/w2schools_logo.png" alt="w3schools logo" class="img" id="w3school">
                            </button>
                        </a>
                    </td>
                    <!-- Second Column (9anime) -->
                    <td class="button">
                        <!-- Actual link to aniwatch -->
                        <a href="https://aniwatchtv.to/home" target="_blank">
                            <button type="button">
                                <!-- 
                                    Image for the link 
                                    Appears inside button 
                                -->
                                <img src="images/aniwatch.png" alt="aniwatch_logo" class="img" id="anime">
                            </button>
                        </a>
                    </td>
                    <!-- Third Column (Gmail) -->
                    <td class="button">
                        <a href="https://mail.google.com/mail/u/0/?tab=im#inbox" target="_blank">
                            <button type="button">
                                <img src="images/Gmail_logo.png" alt="Gmail_logo" class="img" id="gmail">
                            </button>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
        <script src="Dashboard.js"></script>
    </body>
</html>
